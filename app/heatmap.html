<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly tap heatmap</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem auto; padding: 0 1rem; max-width: 1000px; color: #182333; }
    label, button, input { font: inherit; } button, input { padding: .4rem; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
    .scroll { overflow-x: auto; } table { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 560px; }
    th { font-size: .8rem; font-weight: 500; } td { height: 9px; min-width: 45px; background: #edf1f4; }
    .legend { display: flex; align-items: center; gap: .4rem; } .swatch { width: 24px; height: 16px; }
    a { color: #1357a2; }
  </style>
</head>
<body>
  <a href="/">← Member CSV import</a>
  <h1>Weekly tap heatmap</h1>
  <p>Each cell counts all taps in a 15-minute period, including entries and exits. Times use your browser's time zone: <strong id="zone"></strong>.</p>
  <div class="controls"><button id="previous" type="button">← Previous week</button><label for="date">Week containing</label><input id="date" type="date"><button id="next" type="button">Next week →</button></div>
  <p id="status" role="status">Loading…</p>
  <div class="legend" aria-label="Color scale"><span>Fewer taps</span><span class="swatch" style="background:#edf1f4"></span><span class="swatch" style="background:#b7dfc5"></span><span class="swatch" style="background:#63b77d"></span><span class="swatch" style="background:#258a52"></span><span class="swatch" style="background:#07562f"></span><span>More taps</span></div>
  <div class="scroll"><table id="heatmap"><caption id="caption"></caption><thead id="head"></thead><tbody id="body"></tbody></table></div>
  <script>
    const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    document.getElementById('zone').textContent = zone;
    const input = document.getElementById('date'), status = document.getElementById('status');
    const localDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    input.value = localDate(new Date());
    let requestNumber = 0;
    async function load() {
      if (!input.value) return;
      const request = ++requestNumber;
      status.textContent = 'Loading…';
      try {
        const response = await fetch(`/api/heatmap?date=${encodeURIComponent(input.value)}&timezone=${encodeURIComponent(zone)}`);
        const data = await response.json();
        if (request !== requestNumber) return;
        if (!response.ok) throw new Error(data.detail || 'Could not load taps');
        const colors = ['#edf1f4', '#b7dfc5', '#63b77d', '#258a52', '#07562f'];
        const max = Math.max(0, ...data.counts.flat());
        const head = document.getElementById('head'), body = document.getElementById('body');
        head.replaceChildren(); body.replaceChildren();
        const header = document.createElement('tr');
        const blank = document.createElement('th'); blank.textContent = 'Time'; header.appendChild(blank);
        for (const day of data.days) { const th = document.createElement('th'); th.scope = 'col'; th.textContent = day; header.appendChild(th); }
        head.appendChild(header);
        for (let slot = 0; slot < 96; slot++) {
          const row = document.createElement('tr'), time = `${String(Math.floor(slot / 4)).padStart(2,'0')}:${String((slot % 4)*15).padStart(2,'0')}`;
          const label = document.createElement('th'); label.scope = 'row'; label.textContent = time; row.appendChild(label);
          for (let day = 0; day < 7; day++) {
            const count = data.counts[day][slot], cell = document.createElement('td');
            cell.style.background = colors[count === 0 ? 0 : Math.ceil(count / max * 4)];
            cell.title = `${data.days[day]} ${time}: ${count} tap${count === 1 ? '' : 's'}`;
            cell.setAttribute('aria-label', cell.title); row.appendChild(cell);
          }
          body.appendChild(row);
        }
        document.getElementById('caption').textContent = `Week of ${data.days[0]}`;
        status.textContent = `${data.total} taps this week. Darkest cell: ${max} taps.`;
      } catch (error) { if (request === requestNumber) status.textContent = `Unable to load heatmap: ${error.message}`; }
    }
    input.addEventListener('change', load);
    function move(days) { if (!input.value) return; const d = new Date(input.value + 'T12:00:00'); d.setDate(d.getDate() + days); input.value = localDate(d); load(); }
    document.getElementById('previous').onclick = () => move(-7);
    document.getElementById('next').onclick = () => move(7);
    load();
  </script>
</body>
</html>
